@if (owner()) {
  <span role="group" aria-label="At a glance" [attr.data-tone]="briefing().tone">
    <button mat-button type="button" class="dashboard-briefing-action"
      [attr.aria-label]="(detailsExpanded() ? 'Hide' : 'Show') + ' Today details: ' + fullSentence()"
      [attr.aria-expanded]="detailsExpanded()" [attr.aria-controls]="detailsId()" (click)="toggleDetails()">
      @if (greeting()) {
        <span class="dashboard-today-greeting">{{ greeting() }}</span><span aria-hidden="true"> — </span>
      }
      <span class="dashboard-briefing-sentence" role="status" aria-atomic="true">{{ sentence() }}</span>
    </button>
  </span>
}
