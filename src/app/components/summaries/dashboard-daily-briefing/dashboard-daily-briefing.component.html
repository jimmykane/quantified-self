@if (owner()) {
  <section aria-label="At a glance" [attr.data-tone]="briefing().tone">
    <button mat-button type="button" class="dashboard-briefing-action"
      [attr.aria-label]="(detailsExpanded() ? 'Hide' : 'Show') + ' Today details: ' + briefing().headline"
      [attr.aria-expanded]="detailsExpanded()" [attr.aria-controls]="detailsId()" (click)="toggleDetails()">
      <span class="dashboard-briefing-content">
        <span class="dashboard-briefing-dot" aria-hidden="true"></span>
        <span class="dashboard-briefing-sentence" role="status" aria-atomic="true">{{ briefing().headline }}</span>
        <mat-icon aria-hidden="true">{{ detailsExpanded() ? 'expand_less' : 'expand_more' }}</mat-icon>
      </span>
    </button>
  </section>
}
