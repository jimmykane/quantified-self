<section class="signal-preview" data-nosnippet aria-label="Training chart previews">
  <div class="signal-preview-note">
    <small>Same chart families used in Training</small>
  </div>

  <div class="signal-preview-grid">
    @for (preview of previews; track preview.key) {
      <article class="signal-preview-widget">
        <header>
          <div>
            <h4>{{ preview.title }}</h4>
            <small>{{ preview.context }}</small>
          </div>
          <strong>{{ preview.value }}</strong>
        </header>
        <div
          #chartDiv
          class="signal-preview-chart"
          role="img"
          [attr.aria-label]="preview.ariaLabel">
        </div>
      </article>
    }

    <article class="signal-preview-form-widget">
      <div class="signal-preview-form-heading">
        <div>
          <h4>Form (TSS)</h4>
          <small>Fitness, fatigue, and form from daily training stress</small>
        </div>
      </div>
      <div class="signal-preview-form-chart" role="img"
        aria-label="Form and Training Stress Score chart showing fitness, fatigue, current form, and latest workout TSS">
        <app-form-chart [darkTheme]="darkTheme()" [data]="formTimeline" [absoluteLatestPoint]="latestFormPoint"
          timelineWindow="w"></app-form-chart>
      </div>
    </article>
  </div>
</section>
