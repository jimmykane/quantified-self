<h2 mat-dialog-title>Account already exists</h2>
<mat-dialog-content>
  <p class="description">We found an existing account for <strong>{{ data.email }}</strong>.</p>
  <p class="description">Sign in with an existing method to link your new <strong>{{ pendingProviderName }}</strong> login.</p>
  <div class="options-list">
    <ng-container *ngFor="let provider of data.existingProviders">
      <button mat-stroked-button type="button" class="provider-button google" *ngIf="provider.includes('google')"
        (click)="onSelectProvider(provider)">
        <mat-icon svgIcon="google_logo_light" aria-hidden="true"></mat-icon>
        Sign in with Google
      </button>
      <button mat-stroked-button type="button" class="provider-button github" *ngIf="provider.includes('github')"
        (click)="onSelectProvider(provider)">
        <mat-icon svgIcon="github_logo" aria-hidden="true"></mat-icon>
        Sign in with GitHub
      </button>
      <button mat-stroked-button type="button" class="provider-button email" *ngIf="provider === 'password'"
        (click)="onSelectProvider('emailLink')">
        <mat-icon aria-hidden="true">mail_outline</mat-icon>
        Send sign-in link
      </button>
    </ng-container>
  </div>
  <p class="benefit">Once linked, you can use either method to sign in.</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" class="cancel-button" (click)="onCancel()">Cancel</button>
</mat-dialog-actions>
