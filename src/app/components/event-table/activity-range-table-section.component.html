<section class="activity-range-table-section">
  <header class="activity-range-table-section-header">
    <div>
      <h2>{{ heading() }}</h2>
      @if (periodLabel()) {
      <span>{{ periodLabel() }}</span>
      }
    </div>
  </header>

  @if (hasError()) {
  <div class="activity-range-table-state activity-range-table-state--error" role="alert">
    <mat-icon aria-hidden="true">error_outline</mat-icon>
    <span>{{ resolvedErrorMessage() }}</span>
    <button mat-stroked-button type="button" (click)="retry()">
      <mat-icon aria-hidden="true">refresh</mat-icon>
      <span>Retry</span>
    </button>
  </div>
  } @else if (isReady() && events().length === 0) {
  <div class="activity-range-table-state activity-range-table-state--empty">
    <mat-icon aria-hidden="true">table_rows</mat-icon>
    <span>{{ resolvedEmptyMessage() }}</span>
  </div>
  } @else if ((isReady() || isLoading()) && user(); as user) {
  <app-event-table presentation="dashboard" [user]="user" [targetUser]="targetUser() || user"
    [events]="events()" [showActions]="true" [isLoading]="isLoading()">
  </app-event-table>
  }
</section>
