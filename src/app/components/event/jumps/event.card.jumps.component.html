@if (activitiesWithJumps.length > 0) {
<app-event-section-header icon="monitoring" title="Jumps"></app-event-section-header>
<mat-tab-group [dynamicHeight]="true" [preserveContent]="true">
  @for (view of jumpActivityViews; track view.key) {
  <mat-tab [label]="view.label">
    @if (view.dataSource) {
    <section class="table-container">
      <table mat-table class="jump-table" [dataSource]="view.dataSource" matSort matSortDisableClear
        [attr.aria-label]="view.label + ' jumps'"
        (matSortChange)="sortRows(view.dataSource, $event)">
        @for (column of view.columns; track column) {
        <ng-container [matColumnDef]="column" [sticky]="isSticky(column)">
          <th mat-header-cell *matHeaderCellDef class="jump-table-cell"
            [class.jump-index-cell]="column === '#'" [class.jump-time-cell]="column === 'At'"
            [mat-sort-header]="column" [attr.aria-label]="'Sort by ' + column">
            <app-data-type-icon [dataType]="column"></app-data-type-icon>
          </th>
          <td mat-cell *matCellDef="let row" class="jump-table-cell"
            [class.jump-index-cell]="column === '#'" [class.jump-time-cell]="column === 'At'">{{ row[column] }}</td>
        </ng-container>
        }

        <tr mat-header-row *matHeaderRowDef="view.columns"></tr>
        <tr mat-row *matRowDef="let row; columns: view.columns;"></tr>
      </table>
    </section>
    }
  </mat-tab>
  }
</mat-tab-group>
}
