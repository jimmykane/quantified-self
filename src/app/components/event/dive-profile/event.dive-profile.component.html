@if (model(); as profile) {
<section class="dive-profile-section" aria-label="Dive profile">
  <app-event-section-header icon="scuba_diving" title="Dive Profile"></app-event-section-header>
  <div class="dive-profile-content">
    <app-event-card-chart-panel [panel]="profile.depthPanel" [overlayPanel]="selectedOverlayPanel()"
      [overlayOptions]="overlayOptions()" [selectedOverlayDataType]="selectedOverlayDataType()"
      [xAxisType]="xAxisType" [darkTheme]="darkTheme" [useAnimations]="useAnimations"
      [xDomain]="xDomain()" [cursorBehaviour]="cursorBehaviour()" [showDateOnTimeAxis]="false"
      [showLaps]="false" [showSwimLengths]="false" [strokeWidth]="strokeWidth()"
      [fillOpacity]="fillOpacity()" [userUnitSettings]="unitSettings"
      [showActivityNamesInTooltip]="showActivityNames()"
      (overlayDataTypeChange)="onOverlayDataTypeChange($event)">
    </app-event-card-chart-panel>
  </div>
</section>
}
