<section class="qs-workspace-page activities-page">
  <app-page-header title="Activities" leadingIcon="list_alt" subtitle="Find activities by date, sport or tag.">
    <button pageHeaderTitleActions mat-icon-button aria-label="Refresh activities" (click)="refresh()"
      [disabled]="loading() || catalogLoading() || !user()">
      <mat-icon>refresh</mat-icon>
    </button>
  </app-page-header>

  @if (user()) {
    @if (historyError()) {
      <div class="activity-history-status">
        <span role="alert">Activities couldn’t be loaded. Try again.</span>
        <button mat-button (click)="retryActivities()">Try again</button>
      </div>
    }
    @if (catalogError()) {
      <div class="activity-catalog-error" role="alert">
        <span>Saved tags couldn’t be loaded.</span>
        <button mat-button (click)="retryCatalog()" [disabled]="catalogLoading()">Try again</button>
      </div>
    }
    @for (tableUser of tableUsers(); track tableUser.uid) {
      <app-event-table [user]="tableUser" [events]="filteredEvents()" [showActions]="true" presentation="dashboard"
        [isLoading]="loading()" [showTagFilter]="false"
        [filterContext]="filterContext()" [preserveSearchOnFilterChange]="true" [hideGeneratedNames]="true"
        [emptyMessage]="emptyMessage()" [emptyHint]="emptyHint()"
        [hasLoadError]="historyError()"
        (eventsChange)="onEventsChange($event)">
        <div event-table-filters class="activity-explorer-filters">
          <app-table-date-filter [options]="periods" [value]="period()" customValue="custom" allValue="all"
            [rangeForm]="customDateForm" [startDate]="customDates()?.startDate || null" [endDate]="customDates()?.endDate || null"
            (selectionChange)="selectPeriod($event)" (applied)="applyCustomRange()" (cancelled)="cancelCustomRange()"
            (cleared)="clearCustomRange()" (calendarOpened)="onCustomPickerOpened()"></app-table-date-filter>
          <app-activity-filter-picker label="Sports" allLabel="All sports" searchLabel="Search sports" [textButton]="true" triggerIcon="directions_run"
            [disabled]="loading()"
            [options]="sportOptions()" [selectedValues]="selectedSports()" [shortcuts]="sportShortcuts()"
            (selectionChange)="selectSports($event)"></app-activity-filter-picker>
          <app-activity-filter-picker label="Tags" allLabel="All tags" searchLabel="Search tags" [textButton]="true" triggerIcon="sell"
            [disabled]="loading()"
            [options]="tagOptions()" [selectedValues]="tagFilterValues()" [loading]="catalogLoading()"
            (selectionChange)="selectTagFilters($event)"></app-activity-filter-picker>
          @if (hasMergedEvents()) {
            <app-merged-activities-toggle [checked]="includeMergedEvents()" [disabled]="loading()" hint=""
              (checkedChange)="selectMergedEvents($event)"></app-merged-activities-toggle>
          }
        </div>
        <button event-table-empty-action mat-button type="button" (click)="openDateFilter()">
          <mat-icon aria-hidden="true">date_range</mat-icon>Change dates
        </button>
      </app-event-table>
    }
  }
</section>
