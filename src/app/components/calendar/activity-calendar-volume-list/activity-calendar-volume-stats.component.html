@if (stats().length) {
<div class="calendar-family-volume-stats" role="list" aria-label="Recorded totals">
  @for (stat of stats(); track stat.metric) {
  <span class="calendar-family-volume-stat" role="listitem"
    [class.calendar-family-volume-stat--bar-metric]="stat.isBarMetric"
    [attr.aria-label]="stat.ariaLabel">
    <mat-icon aria-hidden="true">{{ stat.icon }}</mat-icon>
    <span class="calendar-family-volume-stat-value">{{ stat.valueLabel }}</span>
  </span>
  }
</div>
}
