<section class="calendar-month-picker-bottom-sheet" aria-label="Activity calendar">
  <app-bottom-sheet-header title="Calendar" icon="calendar_month">
    <button mat-icon-button type="button" appHapticTap aria-label="Close calendar" matTooltip="Close" (click)="dismiss()">
      <mat-icon>close</mat-icon>
    </button>
  </app-bottom-sheet-header>

  <div class="bottom-sheet-content calendar-month-picker-content">
    <app-activity-calendar-tile [timelineNotes]="data.timelineNotes ?? null" [user]="data.user" [fillHeight]="false" [showHeading]="false" [showNavigation]="true">
    </app-activity-calendar-tile>
  </div>
</section>
