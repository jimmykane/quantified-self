<div class="bottom-sheet-header">
  <div class="bottom-sheet-title">
    <mat-icon *ngIf="icon" [color]="iconColor">{{ icon }}</mat-icon>
    <h2 mat-dialog-title>
      @if (titleSegments?.length) {
        @for (segment of titleSegments; track $index) {
          <span [class.bottom-sheet-title-numeric]="segment.isNumeric">{{ segment.text }}</span>
        }
      } @else {
        {{ title }}
      }
    </h2>
  </div>
  <div class="bottom-sheet-actions">
    <ng-content></ng-content>
  </div>
</div>
