<span class="compact-select-label">{{ label() }}</span>
<button mat-button type="button" class="compact-select-button" #trigger="matMenuTrigger"
  [matMenuTriggerFor]="menu" [class.is-open]="trigger.menuOpen" [disabled]="disabled()"
  [attr.aria-label]="label() + ': ' + selectedLabel()" (menuOpened)="opened()">
  <span class="table-filter-button-content">
    <span>{{ selectedLabel() }}</span>
    <mat-icon class="table-filter-chevron" aria-hidden="true">{{ trigger.menuOpen ? 'keyboard_arrow_up' : 'keyboard_arrow_down' }}</mat-icon>
  </span>
</button>
<mat-menu #menu="matMenu" class="qs-menu-panel">
  @for (option of options(); track option.value) {
    <button mat-menu-item type="button" class="compact-select-option" role="menuitemradio"
      [attr.aria-checked]="option.value === value()" [class.is-selected]="option.value === value()"
      [disabled]="disabled() || option.disabled" (click)="select(option.value)">
      <span class="compact-select-option-content"><span>{{ option.label }}</span>
        @if (option.value === value()) { <mat-icon aria-hidden="true">check</mat-icon> }
      </span>
    </button>
  }
</mat-menu>
