<button mat-button type="button" class="merged-events-button" [attr.aria-label]="label()"
  [attr.aria-pressed]="checked()" [disabled]="disabled()" (click)="checkedChange.emit(!checked())">
  <span class="table-filter-button-content"><mat-icon aria-hidden="true">{{ checked() ? 'check_box' : 'check_box_outline_blank' }}</mat-icon>
    <span>{{ label() }}</span></span>
</button>
@if (disabled() && !checked() && hint()) { <span class="merge-toggle-hint">{{ hint() }}</span> }
