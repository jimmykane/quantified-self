<button mat-button type="button" class="merged-events-button" [attr.aria-label]="label()"
  [attr.aria-pressed]="checked()" [disabled]="disabled()" (click)="checkedChange.emit(!checked())">
  <mat-icon aria-hidden="true">{{ checked() ? 'check_box' : 'check_box_outline_blank' }}</mat-icon>
  <span>Merged</span>
</button>
@if (disabled() && !checked()) { <span class="merge-toggle-hint">{{ hint() }}</span> }
