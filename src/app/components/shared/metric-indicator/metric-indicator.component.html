@if (variant === 'status') {
  <span class="metric-indicator-status" [attr.data-tone]="tone">{{ label }}</span>
} @else if (variant === 'segments') {
  <span class="metric-indicator-segments" role="img" [attr.aria-label]="accessibleValueText">
    @for (active of segmentStates; track $index) {
      <span [class.active]="active" [attr.data-tone]="tone" aria-hidden="true"></span>
    }
  </span>
} @else {
  <span
    class="metric-indicator-track"
    [class.compact]="compact"
    [class.deviation]="variant === 'deviation'"
    [class.with-thresholds]="showThresholds"
    role="progressbar"
    [attr.aria-label]="accessibleValueText"
    [attr.aria-valuemin]="variant === 'deviation' ? -20 : min"
    [attr.aria-valuemax]="variant === 'deviation' ? 20 : max"
    [attr.aria-valuenow]="variant === 'deviation' ? boundedDeviation : value">
    @if (showThresholds) {
      <span class="metric-indicator-threshold threshold-mixed" aria-hidden="true"></span>
      <span class="metric-indicator-threshold threshold-ready" aria-hidden="true"></span>
    }
    @if (variant === 'deviation') {
      <span class="metric-indicator-baseline" aria-hidden="true"></span>
      @if (value !== null) {
        <span class="metric-indicator-deviation-fill" [attr.data-tone]="tone"
          [style.left.%]="deviationStartsAt" [style.width.%]="deviationPercent" aria-hidden="true"></span>
      }
    } @else if (value !== null) {
      <span class="metric-indicator-fill" [attr.data-tone]="tone" [style.width.%]="normalizedPercent" aria-hidden="true"></span>
    }
  </span>
}
