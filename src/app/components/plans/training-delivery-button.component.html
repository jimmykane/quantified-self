@if (visible()) {
  @if (summaries().length) {
    <div class="delivery-summaries" [attr.aria-label]="scope() === 'plan' ? 'Plan sync by service' : 'Workout sync by service'">
      @for (summary of summaries(); track summary.provider) {
        <button mat-button appHapticTap type="button" class="delivery-summary" (click)="open()" [disabled]="disabled()"
          [attr.aria-label]="summary.presentation.displayLabel + ': ' + summary.label + '. ' + (summary.detail ? summary.detail + '. ' : '') + 'Open ' + (scope() === 'plan' ? 'plan' : 'workout') + ' sync details'">
          <span class="delivery-summary-content">
            <app-service-source-icon [presentation]="summary.presentation" [showTooltip]="false" [iconHeight]="16" aria-hidden="true"></app-service-source-icon>
            <span class="delivery-summary-copy"><span>{{ summary.presentation.displayLabel }} · {{ summary.label }}</span>
              @if (summary.detail && summary.detail !== summary.label) { <span class="delivery-summary-detail">{{ summary.detail }}</span> }
            </span>
            <mat-icon aria-hidden="true">{{ summary.icon }}</mat-icon>
          </span>
        </button>
      }
    </div>
  } @else {
  <button mat-button appHapticTap type="button" (click)="open()" [disabled]="disabled()">
    <mat-icon aria-hidden="true">sync</mat-icon>{{ buttonLabel() }}
  </button>
    @if (summaryWorkouts() !== null && (readState().error || summaryState().error)) {
      <span class="delivery-summary-detail" role="status">Sync status unavailable</span>
    }
  }
}
