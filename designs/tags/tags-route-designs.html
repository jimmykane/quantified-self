<script>
(() => {
  const root = document.getElementById('qs-tags-designs');
  const fixtures = JSON.parse(document.getElementById('qs-tags-fixture-data').textContent);
  const { savedTags, activities } = fixtures;
  const allTag = 'All activities';
  const dateFormatter = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short' });
  const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
  const escape = value => String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const countFor = tag => tag === allTag ? activities.length : activities.filter(activity => activity.tags.some(value => value.toLowerCase() === tag.toLowerCase())).length;
  const sportInfo = { Running: ['footprints', 'running'], Cycling: ['bike', 'cycling'], Swimming: ['waves', 'swimming'], 'Trail Running': ['mountain', 'trail'], Walking: ['footprints', 'walking'] };
  const designs = [];
  const savedState = window.openai?.widgetState?.privateContent?.tagsDesigns || {};
  const initializeIcons = () => { if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 18, height: 18 } }); };
  const persist = () => {
    const tagsDesigns = Object.fromEntries(designs.map(design => [design.layout, { tag: design.state.tag, search: design.state.search, directoryOpen: design.state.directoryOpen }]));
    if (window.openai?.setWidgetState) window.openai.setWidgetState({ modelContent: { purpose: 'Tags route design review', selectedTags: Object.fromEntries(designs.map(design => [design.layout, design.state.tag])) }, privateContent: { tagsDesigns } }).catch(() => {});
  };

  root.querySelectorAll('.qs-design').forEach((stage, index) => {
    const layout = stage.dataset.layout;
    stage.append(document.getElementById('qs-tags-shell').content.cloneNode(true));
    const state = { tag: 'Endurance', search: '', tagSearch: '', page: 0, pageSize: 5, sort: 'date', direction: -1, selected: new Set(), directoryOpen: false, unit: 'Metric', comfortable: false, columns: { distance: true, duration: true, tags: true } };
    const restored = savedState[layout];
    if (restored && [allTag, ...savedTags].includes(restored.tag)) state.tag = restored.tag;
    if (typeof restored?.search === 'string') state.search = restored.search;
    if (typeof restored?.directoryOpen === 'boolean') state.directoryOpen = restored.directoryOpen;
    const content = stage.querySelector('.qs-content');
    const tagSearch = `<label class="qs-search">${icon('search')}<input type="search" class="qs-tag-search" placeholder="Find a tag" aria-label="Find a tag" autocomplete="off"></label>`;
    const selector = document.createElement('div');
    selector.className = 'qs-selector';
    const result = document.createElement('section');
    result.className = 'qs-results';
    result.setAttribute('aria-label', 'Activities for selected tag');
    result.append(document.getElementById('qs-tags-events').content.cloneNode(true));
    if (layout === 'library') {
      content.className = 'qs-content qs-split';
      selector.className = 'qs-tag-rail';
      selector.innerHTML = `${tagSearch}<div class="qs-rail-heading"><span>SAVED TAGS</span><span>${savedTags.length}</span></div><div class="qs-tag-list"></div>`;
    } else if (layout === 'tabs') {
      selector.innerHTML = '<div class="qs-tag-list qs-tabs" aria-label="Select a tag"></div>';
    } else if (layout === 'chips') {
      selector.innerHTML = '<div class="qs-rail-heading"><span>SELECT A TAG</span></div><div class="qs-tag-list qs-chip-list" aria-label="Select a tag"></div>';
    } else if (layout === 'gallery') {
      selector.innerHTML = `<div class="qs-selector-tools"><span class="qs-muted">${savedTags.length} saved tags</span>${tagSearch}</div><div class="qs-tag-list qs-gallery" aria-label="Saved tags"></div>`;
    } else if (layout === 'picker') {
      selector.innerHTML = `<div class="qs-focus-picker"><label><span>Activity tag</span><select class="qs-tag-select" aria-label="Select an activity tag">${[allTag, ...savedTags].map(tag => `<option value="${escape(tag)}">${escape(tag)}</option>`).join('')}</select></label><div class="qs-focus-summary"><span class="qs-number qs-picker-count"></span><span class="qs-muted">activities</span></div></div>`;
      result.querySelector('.qs-result-heading').hidden = true;
    } else {
      selector.innerHTML = `<div class="qs-selector-tools"><span class="qs-muted">${savedTags.length} saved tags · A–Z</span>${tagSearch}</div><div class="qs-tag-list qs-directory" aria-label="Tag directory"></div>`;
      const back = document.createElement('button');
      back.type = 'button';
      back.className = 'qs-text-button qs-back cursor-interaction';
      back.dataset.action = 'back';
      back.innerHTML = `${icon('arrow-left')}All tags`;
      result.prepend(back);
    }
    content.append(selector, result);
    const toolbarButton = result.querySelector('[data-action="columns"]');
    const columnMenu = result.querySelector('.qs-column-menu');
    columnMenu.id = `qs-columns-${index}`;
    toolbarButton.setAttribute('aria-controls', columnMenu.id);
    const detail = stage.querySelector('.qs-detail-dialog');
    const detailName = stage.querySelector('.qs-detail-name');
    detailName.id = `qs-detail-title-${index}`;
    detail.setAttribute('aria-labelledby', detailName.id);
    const navigation = stage.querySelector('.qs-sidenav');
    navigation.id = `qs-tags-navigation-${index}`;
    stage.querySelector('[data-action="menu"]').setAttribute('aria-controls', navigation.id);
    let detailReturnFocus = null;

    const setTag = tag => {
      if (![allTag, ...savedTags].includes(tag)) return;
      state.tag = tag; state.page = 0; state.search = ''; state.selected.clear();
      if (layout === 'directory') state.directoryOpen = true;
      render(); persist();
      if (layout === 'directory') result.querySelector('[data-action="back"]').focus();
      else if (layout === 'picker') selector.querySelector('.qs-tag-select').focus();
      else [...selector.querySelectorAll('[data-tag]')].find(button => button.dataset.tag === tag)?.focus();
    };
    function renderTags() {
      const list = selector.querySelector('.qs-tag-list');
      if (list) {
        let tags = layout === 'gallery' || layout === 'directory' ? savedTags : [allTag, ...savedTags];
        tags = tags.filter(tag => tag.toLowerCase().includes(state.tagSearch.toLowerCase()));
        list.innerHTML = tags.map(tag => {
          const count = countFor(tag);
          const start = layout === 'directory' ? `<span class="qs-directory-letter">${escape(tag.charAt(0))}</span>` : icon(tag === allTag ? 'layers' : 'tag');
          const suffix = layout === 'gallery' || layout === 'directory' ? `${count} ${count === 1 ? 'activity' : 'activities'}` : count;
          return `<button type="button" class="qs-tag-button cursor-interaction" data-tag="${escape(tag)}" aria-pressed="${tag === state.tag}" aria-label="${escape(tag)}, ${count} ${count === 1 ? 'activity' : 'activities'}">${start}<span>${escape(tag)}</span><span class="qs-tag-count">${suffix}</span>${layout === 'directory' ? icon('chevron-right') : ''}</button>`;
        }).join('');
        if (!tags.length) list.innerHTML = '<p class="qs-tag-no-results">No saved tags match.</p>';
      }
      const select = selector.querySelector('.qs-tag-select');
      if (select) select.value = state.tag;
      const pickerCount = selector.querySelector('.qs-picker-count');
      if (pickerCount) pickerCount.textContent = countFor(state.tag);
    }
    const metricMarkup = display => `<span class="qs-number qs-metric">${escape(display.value)}${display.unit ? ' ' : ''}<span class="qs-unit">${escape(display.unit)}</span></span>`;
    const tagsMarkup = activity => activity.tags.length ? activity.tags.map(tag => `<span class="qs-cell-tag ${tag === state.tag ? 'is-active' : ''}">${escape(tag)}</span>`).join('') : '<span class="qs-muted">—</span>';
    function render() {
      renderTags();
      selector.hidden = layout === 'directory' && state.directoryOpen;
      result.hidden = layout === 'directory' && !state.directoryOpen;
      stage.classList.toggle('is-comfortable', state.comfortable);
      const membership = activities.filter(activity => state.tag === allTag || activity.tags.some(tag => tag.toLowerCase() === state.tag.toLowerCase()));
      const term = state.search.trim().toLowerCase();
      const matches = membership.filter(activity => `${activity.name} ${activity.sport} ${activity.tags.join(' ')}`.toLowerCase().includes(term));
      matches.sort((a, b) => state.direction * (state.sort === 'distance' ? a.distance - b.distance : a.date.localeCompare(b.date)));
      state.page = Math.min(state.page, Math.max(0, Math.ceil(matches.length / state.pageSize) - 1));
      const rows = matches.slice(state.page * state.pageSize, (state.page + 1) * state.pageSize);
      result.querySelector('.qs-result-title').textContent = state.tag;
      result.querySelector('.qs-result-count').textContent = `${matches.length} ${matches.length === 1 ? 'activity' : 'activities'}`;
      result.querySelector('.qs-activity-search').value = state.search;
      result.querySelector('tbody').innerHTML = rows.map(activity => {
        const [sportIcon, sportColor] = sportInfo[activity.sport];
        const formattedDate = dateFormatter.format(new Date(`${activity.date}T12:00:00Z`));
        const display = activity.display[state.unit];
        return `<tr data-event-id="${escape(activity.id)}"><td><input type="checkbox" data-select-id="${escape(activity.id)}" aria-label="Select ${escape(activity.name)}" ${state.selected.has(activity.id) ? 'checked' : ''}></td><td><span class="qs-date">${escape(formattedDate)}</span><span class="qs-muted">${escape(activity.time)}</span></td><td><button type="button" class="qs-activity-name cursor-interaction" data-event="${escape(activity.id)}">${escape(activity.name)}</button><span class="qs-sport" style="--sport-color:var(--qs-${sportColor})">${icon(sportIcon)}${escape(activity.sport)}</span></td><td data-column-cell="distance" ${state.columns.distance ? '' : 'hidden'}>${metricMarkup(display.distance)}</td><td data-column-cell="duration" ${state.columns.duration ? '' : 'hidden'}>${metricMarkup(display.duration)}</td><td data-column-cell="tags" ${state.columns.tags ? '' : 'hidden'}><span class="qs-cell-tags">${tagsMarkup(activity)}</span></td></tr>`;
      }).join('');
      result.querySelectorAll('[data-column-cell]').forEach(cell => cell.hidden = !state.columns[cell.dataset.columnCell]);
      result.querySelectorAll('[data-column]').forEach(input => input.checked = state.columns[input.dataset.column]);
      const selectAll = result.querySelector('.qs-select-all');
      const selectedOnPage = rows.filter(activity => state.selected.has(activity.id)).length;
      selectAll.checked = rows.length > 0 && selectedOnPage === rows.length;
      selectAll.indeterminate = selectedOnPage > 0 && selectedOnPage < rows.length;
      selectAll.disabled = rows.length === 0;
      result.querySelector('.qs-selection-bar').hidden = !state.selected.size;
      result.querySelector('.qs-selection-count').textContent = `${state.selected.size} selected`;
      const empty = result.querySelector('.qs-empty');
      empty.hidden = matches.length > 0;
      result.querySelector('.qs-table-scroll').hidden = matches.length === 0;
      result.querySelector('.qs-empty-title').textContent = term ? 'No matching activities' : `No activities tagged ${state.tag}`;
      result.querySelector('.qs-empty-hint').textContent = term ? 'Try a different activity name or clear your search.' : 'This tag is saved. Add it to an activity to see it here.';
      result.querySelector('[data-action="clear-search"]').hidden = !term;
      result.querySelector('.qs-page-size').value = state.pageSize;
      result.querySelector('.qs-page-count').textContent = matches.length ? `${state.page * state.pageSize + 1}–${Math.min((state.page + 1) * state.pageSize, matches.length)} of ${matches.length}` : '0 of 0';
      result.querySelector('[data-action="previous"]').disabled = state.page === 0;
      result.querySelector('[data-action="next"]').disabled = (state.page + 1) * state.pageSize >= matches.length;
      result.querySelectorAll('[data-sort]').forEach(button => {
        button.parentElement.setAttribute('aria-sort', state.sort === button.dataset.sort ? state.direction === 1 ? 'ascending' : 'descending' : 'none');
      });
      initializeIcons();
    }
    function closeDetail() {
      stage.querySelector('.qs-detail-overlay').hidden = true;
      stage.querySelector('.qs-main').inert = false;
      navigation.inert = false;
      detailReturnFocus?.focus();
    }
    stage.addEventListener('click', event => {
      const button = event.target.closest('button');
      if (!button || button.disabled) return;
      if (button.dataset.tag) { setTag(button.dataset.tag); return; }
      if (button.dataset.sort) { state.direction = state.sort === button.dataset.sort ? -state.direction : -1; state.sort = button.dataset.sort; state.page = 0; render(); return; }
      if (button.dataset.event) {
        const activity = activities.find(value => value.id === button.dataset.event);
        detailName.textContent = activity.name;
        stage.querySelector('.qs-detail-date').textContent = `${activity.sport} · ${activity.date} · ${activity.time}`;
        const display = activity.display[state.unit];
        stage.querySelector('.qs-detail-metrics').innerHTML = `<div><small>Distance</small><span class="qs-number">${escape(display.distance.text)}</span></div><div><small>Duration</small><span class="qs-number">${escape(display.duration.text)}</span></div>`;
        stage.querySelector('.qs-detail-tags').innerHTML = tagsMarkup(activity);
        detailReturnFocus = button;
        stage.querySelector('.qs-detail-overlay').hidden = false;
        stage.querySelector('.qs-main').inert = true;
        navigation.inert = true;
        stage.querySelector('[data-action="close-detail"]').focus();
        return;
      }
      const action = button.dataset.action;
      if (action === 'menu') { const expanded = stage.classList.toggle('is-nav-open'); button.setAttribute('aria-expanded', expanded); return; }
      if (action === 'columns') { columnMenu.hidden = !columnMenu.hidden; button.setAttribute('aria-expanded', !columnMenu.hidden); return; }
      if (action === 'close-detail') { closeDetail(); return; }
      if (action === 'back') { state.directoryOpen = false; render(); persist(); return; }
      if (action === 'tags-nav') { stage.classList.remove('is-nav-open'); stage.querySelector('[data-action="menu"]').setAttribute('aria-expanded', 'false'); state.directoryOpen = false; render(); persist(); return; }
      if (action === 'previous') state.page -= 1;
      if (action === 'next') state.page += 1;
      if (action === 'clear-selection') state.selected.clear();
      if (action === 'clear-search') { state.search = ''; state.page = 0; }
      render(); persist();
    });
    stage.addEventListener('input', event => {
      if (event.target.classList.contains('qs-activity-search')) { state.search = event.target.value; state.page = 0; render(); persist(); }
      if (event.target.classList.contains('qs-tag-search')) { state.tagSearch = event.target.value; renderTags(); initializeIcons(); }
    });
    stage.addEventListener('change', event => {
      const input = event.target;
      if (input.classList.contains('qs-tag-select')) { setTag(input.value); return; }
      if (input.classList.contains('qs-page-size')) { state.pageSize = Number(input.value); state.page = 0; }
      if (input.dataset.column) state.columns[input.dataset.column] = input.checked;
      if (input.dataset.selectId) { if (input.checked) state.selected.add(input.dataset.selectId); else state.selected.delete(input.dataset.selectId); }
      if (input.classList.contains('qs-select-all')) result.querySelectorAll('[data-select-id]').forEach(checkbox => { if (input.checked) state.selected.add(checkbox.dataset.selectId); else state.selected.delete(checkbox.dataset.selectId); });
      render();
      if (input.dataset.selectId) result.querySelector(`[data-select-id="${input.dataset.selectId}"]`).focus();
    });
    stage.addEventListener('keydown', event => {
      if (stage.querySelector('.qs-detail-overlay').hidden) return;
      if (event.key === 'Escape') { event.preventDefault(); closeDetail(); }
      if (event.key === 'Tab') { event.preventDefault(); stage.querySelector('[data-action="close-detail"]').focus(); }
    });
    render();
    designs.push({ layout, state, render });
    if (globalThis.Tweak) {
      const tweaks = new Tweak({ container: stage, onChange: render });
      tweaks.addSelect(state, 'unit', { label: 'Distance units', options: ['Metric', 'Imperial'] });
      tweaks.addToggle(state, 'comfortable', { label: 'Comfortable table rows' });
    }
  });
  window.addEventListener('openai:set_globals', event => {
    const incoming = event.detail?.globals?.widgetState?.privateContent?.tagsDesigns;
    if (!incoming) return;
    designs.forEach(({ layout, state, render }) => {
      const saved = incoming[layout];
      if (!saved) return;
      if ([allTag, ...savedTags].includes(saved.tag)) state.tag = saved.tag;
      if (typeof saved.search === 'string') state.search = saved.search;
      if (typeof saved.directoryOpen === 'boolean') state.directoryOpen = saved.directoryOpen;
      state.selected.clear(); state.page = 0; render();
    });
  });
})();
</script>
