# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
name: "CodeQL"

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    # Targets, not source branches. Forks and other source branches still need PR scans.
    branches: [main, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 23 * * 6'

jobs:
  scan_route:
    name: Select scan route
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      scan: ${{ steps.route.outputs.scan }}
    steps:
      - name: Reuse push scans for covered internal PRs
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          scan=true
          if [[ "$EVENT_NAME" == 'pull_request' && "$HEAD_REPOSITORY" == "$REPOSITORY" ]]; then
            # Case-sensitive matching, just like the push branch filters.
            case "$HEAD_BRANCH" in
              main|develop|feature/*) scan=false ;;
            esac
          fi
          echo "scan=$scan" >> "$GITHUB_OUTPUT"

  analyze:
    # Covered internal branches reuse push findings (which GitHub maps to open PRs).
    # Keep PR merge scans for forks and branches with no CodeQL push trigger.
    # A skipped duplicate must not publish the active analysis check's name.
    needs: scan_route
    name: ${{ needs.scan_route.outputs.scan == 'true' && 'Analyze' || 'Internal PR - covered by push' }}
    if: ${{ needs.scan_route.outputs.scan == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Override automatic language detection by changing the below list
        # Supported options are ['csharp', 'cpp', 'go', 'java', 'javascript', 'python']
        language: ['javascript']
        # Learn more...
        # https://docs.github.com/en/github/finding-security-vulnerabilities-and-errors-in-your-code/configuring-code-scanning#overriding-automatic-language-detection

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: ./path/to/local/query, your-org/your-repo/queries@main

    # Autobuild attempts to build any compiled languages  (C/C++, C#, or Java).
    # If this step fails, then you should remove it and run the build manually (see below)
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    # ℹ️ Command-line programs to run using the OS shell.
    # 📚 https://git.io/JvXDl

    # ✏️ If the Autobuild fails above, remove it and uncomment the following three lines
    #    and modify them (or add more) to build your code if your project
    #    uses a compiled language

    #- run: |
    #   make bootstrap
    #   make release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
