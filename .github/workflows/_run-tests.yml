name: Reusable Testing Workflow

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch, or tag to test. Defaults to the caller's SHA.
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  # Validation/lint, Functions, frontend and Rules run on independent runners.
  # Keep per-runner test concurrency bounded; only the final gate waits on jobs.
  unit_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Check new commits for credentials
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Test local credential-file guard
        run: npm run credentials:test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check emulator suite coverage and safety
        run: npm run test:emulator-coverage

      - name: Check delivery emulator shard contracts
        run: npm run test:delivery-shards

      - name: Check CI trigger and required-result contracts
        run: npm run test:workflows

      - name: Check Training monitoring definitions and safe provisioning
        run: npm run test:training-monitoring

      - name: Check activity import monitoring definitions and safe provisioning
        run: npm run test:import-monitoring

      - name: Test Health/Sleep monitoring configuration
        run: npm run test:health-sleep-monitoring

      - name: Test recorded activity delivery monitoring configuration
        run: npm run test:activity-delivery-monitoring

      - name: Test route import and delivery monitoring configuration
        run: npm run test:route-monitoring

      - name: Test connection-history coordinator monitoring configuration
        run: npm run test:connection-history-monitoring

      - name: Validate local Quantified Self plugin
        env:
          QS_CHATGPT_APP_ID: plugin_asdk_app_ci_fixture
          QS_PLUGIN_CACHEBUSTER: ci-${{ github.sha }}
        run: |
          npm run plugin:tools
          npm --prefix tools/quantified-self-plugin test
          npm run plugin:validate
          git diff --exit-code

      - name: Run lint
        run: npm run lint

  functions_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # Shared sources compiled by Functions resolve dependencies at the root.
      - name: Install shared dependencies
        run: npm ci

      - name: Install and test functions
        run: |
          cd functions
          npm ci
          npm run lint
          # Preserve serial files and isolated forks within this runner.
          npm run test -- --no-file-parallelism

  functions_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install shared dependencies
        run: npm ci

      - name: Fetch MCP contract comparison revision
        env:
          MCP_CONTRACT_PREVIOUS_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          revision="${MCP_CONTRACT_PREVIOUS_REVISION}"
          if [[ "${revision}" =~ ^[0-9a-fA-F]{7,64}$ ]] \
            && ! [[ "${revision}" =~ ^0+$ ]] \
            && ! git cat-file -e "${revision}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${revision}"
          fi

      - name: Build and verify functions
        env:
          MCP_CONTRACT_PREVIOUS_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          cd functions
          npm ci
          npm run build
          npm run entrypoint:check:compiled
          npm run mcp:contract:check:compiled
          cd ..

  frontend_plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check frontend test environment allocation
        run: npm run test:frontend-config

      - name: Test frontend test policy guards
        run: npm run test:frontend-policy-guards

      - name: Enforce frontend test environment policy
        env:
          QS_FRONTEND_TEST_POLICY_BASE: ${{ github.event.pull_request.base.sha || ((github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && github.event.before) || 'origin/develop' }}
        run: npm run test:frontend-policy

      - name: Check frontend shard contracts
        run: npm run test:frontend-shards

      # Timings are optional hints. One plan is shared by both runners so
      # different cache restores cannot duplicate or omit test files.
      - name: Restore successful frontend timings
        uses: actions/cache/restore@v4
        with:
          path: tmp/frontend-timings/history.json
          key: frontend-timings-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vitest.config.ts', 'src/test-setup.ts', 'tools/frontend-test-shards.mjs', 'tools/frontend-test-shard-cli.mjs', 'tools/frontend-test-sequencer.mjs', 'tools/frontend-test-timing-reporter.mjs') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            frontend-timings-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vitest.config.ts', 'src/test-setup.ts', 'tools/frontend-test-shards.mjs', 'tools/frontend-test-shard-cli.mjs', 'tools/frontend-test-sequencer.mjs', 'tools/frontend-test-timing-reporter.mjs') }}-

      - name: Plan balanced frontend shards
        run: node tools/frontend-test-shard-cli.mjs plan tmp/frontend-timings/history.json tmp/frontend-shards/plan.json

      - name: Upload frontend shard plan
        uses: actions/upload-artifact@v4
        with:
          name: frontend-shard-plan
          path: tmp/frontend-shards/plan.json
          if-no-files-found: error
          retention-days: 7

  frontend_tests:
    name: Frontend tests (${{ matrix.shard }}/2)
    needs: frontend_plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check frontend test environment allocation
        run: npm run test:frontend-config

      - name: Download frontend shard plan
        uses: actions/download-artifact@v4
        with:
          name: frontend-shard-plan
          path: tmp/frontend-shards

      - name: Run app tests
        env:
          NODE_OPTIONS: --max-old-space-size=3072
          QS_FRONTEND_SHARD_PLAN: tmp/frontend-shards/plan.json
          QS_FRONTEND_TIMING_REPORT: tmp/frontend-shards/report/timing.json
        run: npm run test -- --run --shard=${{ matrix.shard }}/2 --reporter=default --reporter=json --reporter=./tools/frontend-test-timing-reporter.mjs --outputFile=tmp/frontend-shards/report/report.json

      - name: Upload frontend shard report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-report-${{ matrix.shard }}
          path: tmp/frontend-shards/report
          if-no-files-found: error
          retention-days: 7

  rules_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Install dependencies
        run: npm ci

      - name: Run firestore rules tests
        run: npm run test:rules

  # Preserve the existing protected-branch context: run-tests / run_tests.
  # No individual runner can satisfy the gate when another fails or is skipped.
  run_tests:
    needs: [unit_tests, functions_tests, functions_build, frontend_plan, frontend_tests, rules_tests, functions_emulators, delivery_plan, delivery_emulators]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all test jobs to succeed
        env:
          UNIT_RESULT: ${{ needs.unit_tests.result }}
          FUNCTIONS_RESULT: ${{ needs.functions_tests.result }}
          FUNCTIONS_BUILD_RESULT: ${{ needs.functions_build.result }}
          FRONTEND_PLAN_RESULT: ${{ needs.frontend_plan.result }}
          FRONTEND_RESULT: ${{ needs.frontend_tests.result }}
          RULES_RESULT: ${{ needs.rules_tests.result }}
          EMULATOR_RESULT: ${{ needs.functions_emulators.result }}
          DELIVERY_PLAN_RESULT: ${{ needs.delivery_plan.result }}
          DELIVERY_RESULT: ${{ needs.delivery_emulators.result }}
        run: |
          for result in "$UNIT_RESULT" "$FUNCTIONS_RESULT" "$FUNCTIONS_BUILD_RESULT" "$FRONTEND_PLAN_RESULT" "$FRONTEND_RESULT" "$RULES_RESULT" "$EMULATOR_RESULT" "$DELIVERY_PLAN_RESULT" "$DELIVERY_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Required test gate failed: validation=$UNIT_RESULT, functions=$FUNCTIONS_RESULT, functions-build=$FUNCTIONS_BUILD_RESULT, frontend-plan=$FRONTEND_PLAN_RESULT, frontend=$FRONTEND_RESULT, rules=$RULES_RESULT, emulators=$EMULATOR_RESULT, delivery-plan=$DELIVERY_PLAN_RESULT, delivery=$DELIVERY_RESULT"
              exit 1
            fi
          done
          echo "All validation, Functions, frontend, Rules and emulator jobs passed."

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download frontend shard plan
        uses: actions/download-artifact@v4
        with:
          name: frontend-shard-plan
          path: tmp/frontend-shards

      - name: Download both frontend reports
        uses: actions/download-artifact@v4
        with:
          pattern: frontend-report-*
          path: tmp/frontend-shards/reports

      - name: Require complete frontend shard reports
        run: node tools/frontend-test-shard-cli.mjs merge tmp/frontend-shards/plan.json tmp/frontend-shards/reports tmp/frontend-timings/history.json

      - name: Download delivery shard plan
        uses: actions/download-artifact@v4
        with:
          name: delivery-shard-plan
          path: tmp/delivery-shards

      - name: Download both delivery reports
        uses: actions/download-artifact@v4
        with:
          pattern: delivery-report-*
          path: tmp/delivery-shards/reports

      - name: Require complete delivery shard reports
        run: node tools/delivery-test-shard-cli.mjs merge tmp/delivery-shards/plan.json tmp/delivery-shards/reports tmp/delivery-timings/history.json

      # Only the complete successful gate publishes timing hints for a future run.
      - name: Save successful frontend timings
        uses: actions/cache/save@v4
        with:
          path: tmp/frontend-timings/history.json
          key: frontend-timings-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vitest.config.ts', 'src/test-setup.ts', 'tools/frontend-test-shards.mjs', 'tools/frontend-test-shard-cli.mjs', 'tools/frontend-test-sequencer.mjs', 'tools/frontend-test-timing-reporter.mjs') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save successful delivery timings
        uses: actions/cache/save@v4
        with:
          path: tmp/delivery-timings/history.json
          key: delivery-timings-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'functions/package-lock.json', 'functions/vitest.config.ts', 'functions/vitest.emulators.config.ts', 'functions/src/test-setup.ts', 'tools/functions-emulator-suites.mjs', 'tools/test-functions-emulators.mjs', 'tools/delivery-test-shards.mjs', 'tools/delivery-test-shard-cli.mjs') }}-${{ github.run_id }}-${{ github.run_attempt }}

  delivery_plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependency install or emulators needed for this shared plan.
      - name: Check delivery emulator shard contracts
        run: npm run test:delivery-shards

      - name: Restore successful delivery timings
        uses: actions/cache/restore@v4
        with:
          path: tmp/delivery-timings/history.json
          key: delivery-timings-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'functions/package-lock.json', 'functions/vitest.config.ts', 'functions/vitest.emulators.config.ts', 'functions/src/test-setup.ts', 'tools/functions-emulator-suites.mjs', 'tools/test-functions-emulators.mjs', 'tools/delivery-test-shards.mjs', 'tools/delivery-test-shard-cli.mjs') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            delivery-timings-v1-${{ runner.os }}-${{ hashFiles('package-lock.json', 'functions/package-lock.json', 'functions/vitest.config.ts', 'functions/vitest.emulators.config.ts', 'functions/src/test-setup.ts', 'tools/functions-emulator-suites.mjs', 'tools/test-functions-emulators.mjs', 'tools/delivery-test-shards.mjs', 'tools/delivery-test-shard-cli.mjs') }}-

      - name: Plan balanced delivery shards
        run: node tools/delivery-test-shard-cli.mjs plan tmp/delivery-timings/history.json tmp/delivery-shards/plan.json

      - name: Upload delivery shard plan
        uses: actions/upload-artifact@v4
        with:
          name: delivery-shard-plan
          path: tmp/delivery-shards/plan.json
          if-no-files-found: error
          retention-days: 7

  delivery_emulators:
    name: Delivery emulators (${{ matrix.shard }}/2)
    needs: delivery_plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1

      - name: Install dependencies and Firebase Tools
        run: |
          npm ci
          npm --prefix functions ci
          npm install -g firebase-tools

      - name: Check emulator suite coverage and safety
        run: npm run test:emulator-coverage

      - name: Download delivery shard plan
        uses: actions/download-artifact@v4
        with:
          name: delivery-shard-plan
          path: tmp/delivery-shards

      - name: Run isolated delivery emulator tests
        run: npm run test:functions-emulators -- delivery --plan tmp/delivery-shards/plan.json --shard ${{ matrix.shard }} --output tmp/delivery-shards/report

      - name: Upload delivery shard report
        uses: actions/upload-artifact@v4
        with:
          name: delivery-report-${{ matrix.shard }}
          path: tmp/delivery-shards/report
          if-no-files-found: error
          retention-days: 7

  functions_emulators:
    name: Functions emulators (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: ["lifecycle", "completion", "mcp-data"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-v1

      - name: Install dependencies and Firebase Tools
        run: |
          npm ci
          npm --prefix functions ci
          npm install -g firebase-tools

      - name: Check emulator suite coverage and safety
        run: npm run test:emulator-coverage

      - name: Run isolated Functions emulator tests
        run: npm run test:functions-emulators -- ${{ matrix.group }}
