name: Reusable Testing Workflow

on:
  workflow_call:
    inputs:
      ref:
        description: Commit, branch, or tag to test. Defaults to the caller's SHA.
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Check new commits for credentials
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

      - name: Test local credential-file guard
        run: npm run credentials:test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Validate local Quantified Self plugin
        env:
          QS_CHATGPT_APP_ID: plugin_asdk_app_ci_fixture
          QS_PLUGIN_CACHEBUSTER: ci-${{ github.sha }}
        run: |
          npm run plugin:tools
          npm --prefix tools/quantified-self-plugin test
          npm run plugin:validate
          git diff --exit-code

      - name: Fetch MCP contract comparison revision
        env:
          MCP_CONTRACT_PREVIOUS_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          revision="${MCP_CONTRACT_PREVIOUS_REVISION}"
          if [[ "${revision}" =~ ^[0-9a-fA-F]{7,64}$ ]] \
            && ! [[ "${revision}" =~ ^0+$ ]] \
            && ! git cat-file -e "${revision}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${revision}"
          fi

      - name: Install and test functions
        env:
          MCP_CONTRACT_PREVIOUS_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          cd functions
          npm ci
          npm run lint
          npm run test
          npm run build
          npm run mcp:contract:check:compiled
          cd ..

      - name: Run lint
        run: npm run lint

      - name: Run firestore rules tests
        run: npm run test:rules

      - name: Run app tests
        env:
          NODE_OPTIONS: --max-old-space-size=3072
        run: npm run test -- --run
