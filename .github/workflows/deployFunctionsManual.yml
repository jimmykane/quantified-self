name: Deploy Functions (manual)

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA already merged into main. Leave blank to deploy the latest main commit.
        required: false
        type: string

concurrency:
  group: production-functions-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve a commit from main
        id: resolve
        env:
          TARGET_COMMIT: ${{ inputs.commit }}
        run: |
          if [[ -n "$TARGET_COMMIT" ]]; then
            target_commit="$TARGET_COMMIT"
          else
            target_commit="origin/main"
          fi

          commit="$(git rev-parse --verify "${target_commit}^{commit}")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "The requested commit is not contained in main." >&2
            exit 1
          fi

          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve
    uses: ./.github/workflows/_run-tests.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  deploy:
    needs:
      - resolve
      - test
    runs-on: ubuntu-latest
    environment: production-deploy
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/242713487388/locations/global/workloadIdentityPools/qs-github/providers/github
          service_account: qs-github-production-deploy@quantified-self-io.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Install and build Functions
        working-directory: functions
        run: |
          npm ci
          npm run build

      - name: Deploy Functions
        run: firebase deploy --only functions
