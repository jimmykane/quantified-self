name: PRODUCTION Build and Deploy

on:
  release:
    types: [published]

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve a release commit from main
        id: resolve
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          commit="$(git rev-list -n 1 "${RELEASE_TAG}")"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "The release tag must reference a commit contained in main." >&2
            exit 1
          fi

          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve
    uses: ./.github/workflows/_run-tests.yml
    with:
      ref: ${{ needs.resolve.outputs.commit }}

  deploy:
    needs:
      - resolve
      - test
    runs-on: ubuntu-latest
    environment: production-deploy
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/242713487388/locations/global/workloadIdentityPools/qs-github/providers/github
          service_account: qs-github-production-deploy@quantified-self-io.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Get licenses
        run: |
          curl "https://firebasestorage.googleapis.com/v0/b/quantified-self-io.appspot.com/o/assets%2Flicenses.json?alt=media&token=470a21d4-571d-432d-a6f6-95df7a24de33" --create-dirs -o licenses.json

      - name: Install dependencies
        run: npm ci

      - name: Build functions
        run: |
          cd functions
          npm ci
          npm run build
          cd ..

      - name: Clean and build
        run: |
          npm run clean
          npm run build-production

      - name: Upload sourcemaps to Sentry
        run: npm run sentry:upload-sourcemaps
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Remove sourcemaps
        run: find dist -name "*.map" -delete

      - name: Deploy to Firebase
        run: firebase deploy --only hosting:production,functions,firestore,storage
