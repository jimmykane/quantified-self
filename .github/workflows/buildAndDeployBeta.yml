name: BETA Build and Deploy

on:
  push:
    branches:
      - develop

# Cancel in-progress deployments when a new commit is pushed
concurrency:
  group: beta-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/_run-tests.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: beta-hosting
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/242713487388/locations/global/workloadIdentityPools/qs-github/providers/github
          service_account: qs-github-beta-hosting@quantified-self-io.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Get licenses
        run: |
          curl "https://firebasestorage.googleapis.com/v0/b/quantified-self-io.appspot.com/o/assets%2Flicenses.json?alt=media&token=470a21d4-571d-432d-a6f6-95df7a24de33" --create-dirs -o licenses.json

      - name: Install dependencies
        run: npm ci

      - name: Build functions
        run: |
          cd functions
          npm ci
          npm run build
          cd ..

      - name: Patch Manifest for Beta
        run: |
          sed -i 's/"name": "Quantified Self"/"name": "Quantified Self Beta"/g' src/manifest.json
          sed -i 's/"short_name": "Quantified Self"/"short_name": "QS Beta"/g' src/manifest.json

      - name: Clean and build
        run: |
          npm run build-beta

      - name: Deploy to Firebase
        run: firebase deploy --only hosting:beta
