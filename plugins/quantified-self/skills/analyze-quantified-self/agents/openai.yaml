interface:
  display_name: "Analyze Quantified Self"
  short_description: "Compare trends across health and fitness data"
  default_prompt: "Use $analyze-quantified-self to give me my daily report with sleep HRV and sleep heart rate for Europe/Helsinki."
dependencies:
  tools:
    - type: "mcp"
      value: "quantified-self"
      description: "Read-only Quantified Self cross-domain health and fitness data"
      transport: "streamable_http"
      url: "https://quantified-self.io/mcp"
policy:
  allow_implicit_invocation: true
