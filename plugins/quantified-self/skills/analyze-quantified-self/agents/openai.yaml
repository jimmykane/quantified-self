interface:
  display_name: "Analyze Quantified Self"
  short_description: "Analyze personal fitness and health trends"
  default_prompt: "Use $analyze-quantified-self to analyze my recent training trends."
dependencies:
  tools:
    - type: "mcp"
      value: "quantified-self"
      description: "Read-only Quantified Self activity, measurement, training, sleep, and route data"
      transport: "streamable_http"
      url: "https://quantified-self.io/mcp"
policy:
  allow_implicit_invocation: true
