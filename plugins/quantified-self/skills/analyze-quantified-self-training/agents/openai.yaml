interface:
  display_name: "Analyze Training"
  short_description: "Read plans, upcoming workouts, and training trends"
  default_prompt: "Use $analyze-quantified-self-training to explain how my training changed over the last four weeks."
dependencies:
  tools:
    - type: "mcp"
      value: "quantified-self"
      description: "Permission-scoped Quantified Self Training reads and explicitly confirmed planning changes"
      transport: "streamable_http"
      url: "https://quantified-self.io/mcp"
policy:
  allow_implicit_invocation: true
